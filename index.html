<!DOCTYPE html>
<html>
    <body>
        <style>
            
            .spider-button-down {
                width: 100px;
                height: 100px;
                border: none;
                cursor: pointer;
                position: absolute;
                right: 0;
                top: 100%;
                background: url('spider_down.png') no-repeat center center;
                background-size: cover;
            }

            .spider-button-down:hover {
                background: url('spider_down_hovered.png') no-repeat center center;
                background-size: cover;
            }

            .spider-button-up {
                width: 100px;
                height: 100px;
                border: none;
                cursor: pointer;
                position: absolute;
                right: 0;
                top: 100%;
                background: url('spider_up.png') no-repeat center center;
                background-size: cover;
            }

            .spider-button-up:hover {
                background: url('spider_up_hovered.png') no-repeat center center;
                background-size: cover;
            }

            .spiderweb {
                width: 200px;
                height: 200px;
                border: none;
                position: absolute;
                right: 0;
                top: 0;
                background: url('spiderweb.png') no-repeat center center;
                background-size: cover;
                z-index: -1;
            }

            .menudown {
                height: 70px;
                border: none;
                position: fixed;
                left: 0;
                right: 0;
                top: 0;
                background: url('menudown.png') no-repeat bottom;
                background-size: cover;
            }

            .text-menudown {
                position: absolute;
                left: 15%;
                color:black;
                font-size: 50px;
            }

            .text-menudown:hover {
                color:deeppink;
            }

            .text-language {
                position: absolute;
                color: black;
                font-size: 30px;
            }

        </style>

        <script>
            let menudown = false;
            let menudowntimer;
            let currentheightofmenudown = 50;

            function intervalmenudown() {
                currentheightofmenudown += 20;
                document.getElementById("menudown").style.height = currentheightofmenudown.toString() + 'px';

                if(currentheightofmenudown == 550) {
                    document.getElementById("home").style.display = 'block';
                    document.getElementById("aboutme").style.display = 'block';
                    document.getElementById("language").style.display = 'block';
                    document.getElementById("selectlanguage").style.display = 'block';
                    clearInterval(menudowntimer);
                }
            }

            function intervalmenuup() {
                currentheightofmenudown -= 20;
                document.getElementById("menudown").style.height = currentheightofmenudown.toString() + 'px';

                if(currentheightofmenudown == 70) {
                    
                    clearInterval(menudowntimer);
                }
            }

            function movedownmenu() {
                if(menudown) {
                    menudown = false;

                    document.getElementById("home").style.display = 'none';
                    document.getElementById("aboutme").style.display = 'none';
                    document.getElementById("language").style.display = 'none';
                    document.getElementById("selectlanguage").style.display = 'none';
                    document.getElementById("spider").className = "spider-button-down";
                    menudowntimer = setInterval(intervalmenuup, 10);
                }

                else {
                    menudown = true;

                    document.getElementById("spider").className = "spider-button-up";
                    menudowntimer = setInterval(intervalmenudown, 10);
                }
            }

            function changelanguage(val) {

                if(val == "tr") {
                    document.getElementById("home").textContent = "Ana Ekran";
                    document.getElementById("aboutme").textContent = "Benimle İlgili";
                    document.getElementById("language").textContent = "Dil"
                }

                else if(val == "en") {
                    document.getElementById("home").textContent = "Home";
                    document.getElementById("aboutme").textContent = "About Me";
                    document.getElementById("language").textContent = "Language"
                }
            }
        </script>

        <div id="menudown", class="menudown">
            <h1 class="text-language", style="display: none; right: 10%; top: 50px;", id="language">Language:</h1>
            <select class="text-language", style="right: 3%; display: none", onchange="changelanguage(this.value)", id="selectlanguage">
                <option class="text-language", value="en">EN</option>
                <option class="text-language", value="tr">TR</option>
            </select>
            <h1 class="text-menudown", style="top: 90px; display: none;", id="home">Home</h1>
            <h1 class="text-menudown", style="top: 140px; display: none;", id="aboutme">About Me</h1>
            <button  id="spider", class="spider-button-down", onclick="movedownmenu()">,
                <div class="spiderweb"></div>
            </button>
        </div>
    </body>
</html>
